name: Build Windows Companion

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64)
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run Core & Config Unit Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/yuntype-win-x64 | Out-Null
          Copy-Item build/Release/yuntype.exe dist/yuntype-win-x64/yuntype.exe
          Copy-Item README.md dist/yuntype-win-x64/README.md
          Compress-Archive -Path dist/yuntype-win-x64/* -DestinationPath dist/yuntype-windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuntype-windows-x64
          path: dist/yuntype-windows-x64.zip
